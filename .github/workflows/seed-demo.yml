name: Seed demo data

on:
  schedule:
    - cron: '5 4 * * *'
  workflow_dispatch:

jobs:
  seed:
    name: Seed demo project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Seed
        run: npm run db:seed:ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
